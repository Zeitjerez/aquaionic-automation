<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Water drop icon with ionic elements -->
  <g id="logo-icon">
    <!-- Main water drop shape -->
    <path d="M30 10C30 10 20 22 20 32C20 37.5228 24.4772 42 30 42C35.5228 42 40 37.5228 40 32C40 22 30 10 30 10Z" fill="#00BCD4"/>

    <!-- Ionic waves inside drop -->
    <path d="M25 28C25 28 27.5 26 30 26C32.5 26 35 28 35 28" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M26 32C26 32 28 30.5 30 30.5C32 30.5 34 32 34 32" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Plus and minus ions -->
    <circle cx="30" cy="22" r="2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="27" cy="35" r="1.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="33" cy="35" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- Company name -->
  <text x="50" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="700" fill="#0A2540" letter-spacing="-0.5">
    Aqua<tspan fill="#00BCD4">ionic</tspan>
  </text>

  <!-- Tagline -->
  <text x="50" y="45" font-family="'DM Sans', Arial, sans-serif" font-size="8" font-weight="400" fill="#8494A7" letter-spacing="0.5">
    PURE WATER SOLUTIONS
  </text>
</svg>
